<!--
  UMRT cross-platform bar — shared partial, not a full header replacement.
  Drop this ABOVE each property's own <header class="site-header">.
  Pair with platform-bar.css (design/theme.json tokens, no build step needed).

  Usage: set data-platform on <html> or <body> to one of:
    hub | shop | forum | book | portal | software | status | docs
  The matching link gets aria-current. Prefer Text is always last.

  Book → https://book.unitedmobilerv.com/ (suite; Square is the intake there).
  Never /go/book or *.pages.dev in this chrome.
-->
<div class="umrt-platform-bar" role="navigation" aria-label="UMRT properties">
  <div class="umrt-platform-bar-inner">
    <a href="https://unitedmobilerv.com/" data-platform-link="hub">Hub</a>
    <a href="https://shop.unitedmobilerv.com/" data-platform-link="shop">Shop</a>
    <a href="https://forum.unitedmobilerv.com/" data-platform-link="forum">Forum</a>
    <a href="https://book.unitedmobilerv.com/" data-platform-link="book">Book</a>
    <a href="https://portal.unitedmobilerv.com/" data-platform-link="portal">Portal</a>
    <a href="https://software.unitedmobilerv.com/" data-platform-link="software">Software</a>
    <a href="https://status.unitedmobilerv.com/" data-platform-link="status">Status</a>
    <a href="https://docs.unitedmobilerv.com/" data-platform-link="docs">Docs</a>
    <a class="umrt-platform-text" href="sms:+16166065277">Prefer Text (616) 606-5277</a>
  </div>
</div>
<script>
  (function () {
    var root = document.documentElement;
    var current = root.getAttribute('data-platform') || (document.body && document.body.getAttribute('data-platform'));
    if (!current) return;
    var link = document.querySelector('.umrt-platform-bar [data-platform-link="' + current + '"]');
    if (link) { link.setAttribute('aria-current', 'page'); link.classList.add('is-current'); }
  })();
</script>
