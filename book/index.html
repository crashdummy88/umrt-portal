<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book · UMRT Portal</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">United Mobile <span>RV</span></a>
      <nav><a href="/book/" aria-current="page">Book</a><a href="/track/">Track</a><a href="/account/">Account</a></nav>
    </header>
    <main>
      <h1>Book a visit</h1>
      <p class="lede">Request a visit here, or book at unitedmobilerv.com/book-service/. Labor 1hr min / 30-min increments; winterize $175 · trip-prep $225 when relevant.</p>
      <form class="card" action="https://unitedmobilerv.com/book-service/" method="get">
        <label for="name">Name</label>
        <input id="name" name="name" required autocomplete="name">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="(616) 606-5277 style">
        <label for="city">City / corridor</label>
        <input id="city" name="city" placeholder="MT · WY · ID · WA">
        <label for="need">What do you need?</label>
        <input id="need" name="need" placeholder="Victron / Starlink install / plumbing…">
        <p style="margin-top:1rem"><button class="btn" type="submit">Continue to Book</button>
        <a class="btn btn-ghost" href="sms:+16166065277">Prefer Text instead</a></p>
      </form>
    </main>
    <footer>United Mobile RV LLC</footer>
  </div>
</body>
</html>
